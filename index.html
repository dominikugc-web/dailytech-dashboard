<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E0A1C">
  <title>Daily-Tech Zahlen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E0A1C'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23C4B5FD'%3EDT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Anmeldung: Die Zahlen liegen verschlüsselt auf GitHub und werden erst hier mit dem Passwort lesbar -->
  <main id="login" class="login">
    <form class="login-card glass" id="login-form">
      <div class="brand brand-lg" aria-hidden="true">DT</div>
      <h1>Daily-Tech Zahlen</h1>
      <p class="muted">Gib dein Passwort ein, um deine Zahlen zu entschlüsseln.</p>
      <label for="pw">Passwort</label>
      <input id="pw" name="pw" type="password" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="merken"> Auf diesem Gerät merken</label>
      <button type="submit" class="btn">Entsperren</button>
      <p id="login-fehler" class="fehler" role="alert"></p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <nav class="sidebar glass" aria-label="Hauptnavigation">
      <div class="side-brand"><span class="brand" aria-hidden="true">DT</span><span><strong>Daily-Tech</strong><small>Geräte erklärt</small></span></div>
      <ul id="nav"></ul>
      <button type="button" class="abmelden" id="abmelden">Abmelden</button>
    </nav>
    <main class="inhalt" id="inhalt" tabindex="-1"></main>
  </div>
</body>
</html>
